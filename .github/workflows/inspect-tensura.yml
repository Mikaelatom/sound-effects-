name: Inspect Tensura API

on:
  push:
    paths:
      - .github/workflows/inspect-tensura.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon -q
      - name: Dump race info
        run: |
          JAR=$(find ~/.gradle/caches -name "tensura-reincarnated-643695-8098859*.jar" | head -1)
          echo "JAR=$JAR"
          mkdir -p t && cd t && unzip -q -o "$JAR"
          echo "=== RACE LANG KEYS ==="
          python3 - <<'EOF'
          import json
          d = json.load(open('assets/tensura/lang/en_us.json', encoding='utf-8'))
          for k, v in d.items():
              if k.startswith('tensura.race.') and not k.endswith('.description'):
                  print(k, '=', v)
          EOF
          echo "=== RACE CLASSES ==="
          find . -path "*race*" -name "*.class" | grep -v '\$' | sort | head -150
          echo "=== TensuraRaces fields ==="
          C=$(find . -name "TensuraRaces.class" | head -1)
          javap -cp . "${C#./}" | head -120
          echo "=== Base race class ==="
          for c in $(find . -path "*tensura/race*" -name "*Race.class" | grep -v '\$' | head -3); do javap -cp . "${c#./}"; done
          echo "=== Race subclasses containing EP ==="
          grep -rl --include=*.class -a "getBaseEP\|getMinEP\|getMaxEP\|getBaseMagicule\|getBaseAura" . | head -20
