modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An addon for Tensura: Reincarnated that strips out the original skills and rebuilds
the magic from their parts into new, skill-based abilities.
'''

[[mixins]]
config="tensurafragments.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tensura"
type="required"
versionRange="[2.0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="manascore_skill"
type="required"
versionRange="[4.0.0.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="manascore_storage"
type="required"
versionRange="[4.0.0.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
type="required"
versionRange="[13.0.8,)"
ordering="AFTER"
side="BOTH"
